[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "transformers==5.3.0",
    "xxhash",
    "numpy",
    "safetensors",
    "tqdm",
    "pillow",
    "torchvision",
]

[project.optional-dependencies]
cuda = ["triton>=3.0.0; platform_system == 'Linux'", "flash-attn; platform_system == 'Linux'"]
test = ["pytest>=8"]
eval = ["rouge", "jieba", "fuzzywuzzy"]

[project.urls]
Homepage="https://github.com/GeeeekExplorer/nano-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]
